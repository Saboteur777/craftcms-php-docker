name: Docker images

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '7.4/**'
      - '8.1/**'
      - '8.2/**'
      - '8.5/**'
      - '.github/workflows/docker-images.yml'
  pull_request:
    paths:
      - '7.4/**'
      - '8.1/**'
      - '8.2/**'
      - '8.5/**'
      - '.github/workflows/docker-images.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.1', '8.2', '8.5']
    env:
      IMAGE_TAG: webmenedzser/craftcms-php:${{ matrix.php-version }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.php-version }}
          platforms: linux/amd64
          tags: ${{ env.IMAGE_TAG }}
          pull: true
          no-cache: true
          load: true

      - name: Check PHP, Composer and FPM
        run: |
          docker run --rm "$IMAGE_TAG" php --version
          docker run --rm "$IMAGE_TAG" composer --version
          docker run --rm "$IMAGE_TAG" php-fpm --test

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'Saboteur777/craftcms-php-docker'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'Saboteur777/craftcms-php-docker'
        run: docker push "$IMAGE_TAG"
